# 纯 GHCR 镜像部署：只拉取 CI 产物，不做本地构建。
# 用法：
#   1. cp .env.example .env，填入 WECHAT_TOKEN / WECHAT_ALLOW_OPENID / MEMOS_API_URL / MEMOS_ACCESS_TOKEN
#   2. docker compose -f docker-compose-ghcr.yml up -d
#   3. 锁版本：把下面 image 的 :latest 换成具体 tag，如 :1.0.0
services:
  memos-wechat:
    # GHCR 要求镜像名全小写，与仓库 owner/name 一致
    image: ghcr.io/jingyuan9527/memos-wechat:latest
    container_name: memos-wechat
    restart: unless-stopped
    environment:
      # 微信测试号后台自定义的 Token（必填）
      WECHAT_TOKEN: "${WECHAT_TOKEN:?请在 .env 中设置 WECHAT_TOKEN}"
      # 允许处理消息的唯一发送者 OpenID（必填）
      WECHAT_ALLOW_OPENID: "${WECHAT_ALLOW_OPENID:?请在 .env 中设置 WECHAT_ALLOW_OPENID}"
      # Memos 实例基地址，不含 /api/v1 前缀（必填）
      MEMOS_API_URL: "${MEMOS_API_URL:?请在 .env 中设置 MEMOS_API_URL}"
      # Memos 访问令牌，即 Bearer 之后的字符串（必填）
      MEMOS_ACCESS_TOKEN: "${MEMOS_ACCESS_TOKEN:?请在 .env 中设置 MEMOS_ACCESS_TOKEN}"
      # 容器内监听端口，与 Dockerfile 的 EXPOSE 保持一致
      LISTEN_PORT: "8080"
    ports:
      # 宿主机端口
      - "8080:8080"
